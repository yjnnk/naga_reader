<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Finder installation</title>
  <desc id="desc">A Finder window showing NagaReader.app in the user's Applications folder.</desc>
  <rect width="900" height="540" fill="#15161a"/>
  <rect x="62" y="48" width="776" height="444" rx="14" fill="#f2f2f4" stroke="#c9c9cf"/>
  <circle cx="94" cy="78" r="9" fill="#ff5f57"/>
  <circle cx="122" cy="78" r="9" fill="#ffbd2e"/>
  <circle cx="150" cy="78" r="9" fill="#28c840"/>
  <rect x="62" y="104" width="210" height="388" fill="#e6e6eb"/>
  <text x="92" y="150" fill="#555963" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700">Favoritos</text>
  <text x="92" y="194" fill="#23252b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Applications</text>
  <rect x="292" y="128" width="512" height="92" rx="12" fill="#ffffff" stroke="#d8d8de"/>
  <rect x="326" y="156" width="50" height="42" rx="8" fill="#3d7bff"/>
  <text x="406" y="184" fill="#202126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">NagaReader.app</text>
  <text x="406" y="210" fill="#6b6d75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">~/Applications/NagaReader.app</text>
  <text x="292" y="292" fill="#202126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700">Instalacao local</text>
  <text x="292" y="336" fill="#555963" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19">Rode ./scripts/build-app.sh e abra o app pelo Finder.</text>
  <text x="292" y="374" fill="#555963" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19">Nao precisa de App Store, DMG ou permissao de admin.</text>
</svg>
